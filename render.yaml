services:
  - type: web
    name: justmyluck-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    disk:
      name: subscribers-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: FRONTEND_ORIGINS
        value: https://justmyluck.wtf,https://lawstcause.github.io
      - key: DB_PATH
        value: /opt/render/project/src/backend/data/subscribers.db
